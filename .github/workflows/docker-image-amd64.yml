name: Build Dev Image

on:
  push:
    branches: [ "dev" ] # 仅在 dev 分支推送时触发
  release:
    types: [ published ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write # 必须有写入权限

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # 新增：将仓库名转换为全小写
      - name: Lowercase repo name
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      # 登录 GitHub 镜像仓库
      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create VERSION file
        run: |
          # 如果是 tag 触发，就用 tag 名；如果是 branch 触发，就用 dev
          echo "${{ github.ref_name }}" > VERSION
          # 验证文件是否存在
          cat VERSION

      # 构建并推送 (镜像名通常为 ghcr.io/用户名/仓库名:latest)
      - name: Build and Push
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}:dev
            ghcr.io/${{ env.REPO_LOWER }}:${{ github.ref_name }}
